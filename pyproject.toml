[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsb-fei-machine-learning-exercises"
version = "0.1.0"
description = "Machine learning exercises in PyTorch at FEI, VSB-TU Ostrava."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "jupyter",
    "scikit-learn",
    "scikit-image",
    "scipy",
    "torch",
    "torchinfo",
    "torchvision",
]

# This repository contains notebooks rather than an importable Python package.
[tool.setuptools]
packages = []
